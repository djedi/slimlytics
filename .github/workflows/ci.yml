name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same PR/branch.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-bytes
  VISITOR_HASH_SECRET: ci-only-visitor-secret-at-least-thirty-two-bytes

jobs:
  changes:
    # Keep fork PR code off the persistent self-hosted machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      web: ${{ steps.select.outputs.web }}
      cli: ${{ steps.select.outputs.cli }}
      container: ${{ steps.select.outputs.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test change selection
        run: |
          node --test scripts/ci-changes.test.mjs
          python3 .github/scripts/local_pr_review_test.py -v
      - name: Select affected checks
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.mjs

  backend:
    needs: changes
    # Select only affected PR checks; pushes to main select all gates.
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, slimlytics]
    env:
      # Persistent across runs on the self-hosted runner, so builds are incremental.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../.cargo-target/backend
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain PATH
        run: |
          echo /opt/homebrew/opt/rustup/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/opt/node@24/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Start disposable PostgreSQL
        run: |
          name="pg-slimlytics-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "PG_CONTAINER=$name" >> "$GITHUB_ENV"
          docker run -d --name "$name" -p 127.0.0.1::5432 \
            -e POSTGRES_USER=slimlytics -e POSTGRES_PASSWORD=slimlytics -e POSTGRES_DB=slimlytics_test \
            postgres:17-alpine
          for i in $(seq 1 40); do
            docker exec "$name" pg_isready -U slimlytics -d slimlytics_test && break
            sleep 1
          done
          port=$(docker port "$name" 5432/tcp | head -n1 | sed 's/.*://')
          url="postgres://slimlytics:slimlytics@127.0.0.1:$port/slimlytics_test"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=$url" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
      - name: Test, including PostgreSQL integration tests
        run: cargo test --manifest-path backend/Cargo.toml --all-targets -- --include-ignored --test-threads=1
      - name: Stop PostgreSQL
        if: always()
        run: if [ -n "${PG_CONTAINER:-}" ]; then docker rm -f "$PG_CONTAINER"; fi

  web:
    needs: changes
    # Select only affected PR checks; pushes to main select all gates.
    if: needs.changes.outputs.web == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, slimlytics]
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain PATH
        run: |
          echo /opt/homebrew/opt/rustup/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/opt/node@24/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Install tracker
        run: npm --prefix tracker ci
      - name: Test and build tracker
        run: npm --prefix tracker test -- --run && npm --prefix tracker run check && npm --prefix tracker run build
      - name: Install frontend
        run: npm --prefix frontend ci
      - name: Copy tracker artifacts
        run: |
          cp tracker/dist/slimlytics.js frontend/static/tracker.js
          cp tracker/dist/slimlytics.js frontend/static/s.js
          mkdir -p frontend/src/lib/server/generated
          cp tracker/dist/slimlytics.js frontend/src/lib/server/generated/tracker.iife.txt
      - name: Check, test, and build frontend
        run: npm --prefix frontend run check && npm --prefix frontend test -- --run && npm --prefix frontend run build

  cli:
    needs: changes
    # Select only affected PR checks; pushes to main select all gates.
    if: needs.changes.outputs.cli == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, slimlytics]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../.cargo-target/cli
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain PATH
        run: |
          echo /opt/homebrew/opt/rustup/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/opt/node@24/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --manifest-path cli/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml --all-targets
      - name: Locked release build and installer syntax
        run: cargo build --manifest-path cli/Cargo.toml --release --locked && sh -n scripts/install-cli.sh

  container:
    # Self-hosted runner on a public repo: never run fork PR code on it.
    # Allow unrelated jobs to be skipped, but never build after a failure/cancellation.
    if: >-
      ${{ !failure() && !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.container == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64, slimlytics]
    needs: [changes, backend, web, cli]
    env:
      COMPOSE_PROJECT_NAME: slimlytics-ci-${{ github.run_id }}-${{ github.run_attempt }}
      HTTP_PORT: "18080"
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
      CI_RUN_WEB_CHECKS: ${{ needs.web.result == 'success' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain PATH
        run: |
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Generate disposable Compose environment
        run: ./scripts/generate-env.sh
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start and smoke-test Compose
        run: |
          docker compose up -d
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:18080/health && curl --fail --silent http://127.0.0.1:18080/ready && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Stop Compose
        if: always()
        run: docker compose down -v
