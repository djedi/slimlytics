name: Build and deploy

# PRs: test and build release artifacts in the background (nothing is required to merge).
# The artifacts are stored on the runner host under the tested tree's hash.
# Merge to main: when main's tree matches a tested PR build, deploy those artifacts at once;
# otherwise test, build, and deploy in this run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a main run mid-deploy: a newer merge waits, and a newer pending run replaces an
# older pending one (its deploy includes those commits). A PR update cancels its stale run.
concurrency:
  group: build-and-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Release artifacts by git tree hash under the runner user's home, shared by every runner
  # on the host (each step expands it as "$HOME/$RELEASE_STORE").
  RELEASE_STORE: .cache/slimlytics-releases
  JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-bytes
  VISITOR_HASH_SECRET: ci-only-visitor-secret-at-least-thirty-two-bytes

jobs:
  release:
    # Keep fork PR code off the persistent self-hosted machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # On the runner host, so it can see whether this tree's release was already built and tested.
    runs-on: [self-hosted, macOS, ARM64, slimlytics]
    outputs:
      tree: ${{ steps.release.outputs.tree }}
      prebuilt: ${{ steps.release.outputs.prebuilt }}
    steps:
      - uses: actions/checkout@v7
      - name: Find a tested release for this tree
        id: release
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          # Only main reuses a release; a PR always tests and builds its own.
          if [[ "$GITHUB_EVENT_NAME" != pull_request && -f "$HOME/$RELEASE_STORE/$tree/TESTED" ]]; then
            echo "::notice::Deploying the release already built and tested for tree ${tree:0:12}."
            # Mark it recently used so retention cleanup keeps it.
            touch "$HOME/$RELEASE_STORE/$tree"
            echo "prebuilt=true" >> "$GITHUB_OUTPUT"
          else
            echo "prebuilt=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: release
    # Every gate runs, so a passing PR vouches for the whole tree; main skips them only when
    # its tree is already tested.
    if: needs.release.outputs.prebuilt != 'true'
    runs-on: [self-hosted, macOS, ARM64, slimlytics]
    env:
      # Persistent across runs on the self-hosted runner, so builds are incremental.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../.cargo-target/backend
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain PATH
        run: |
          echo /opt/homebrew/opt/rustup/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/opt/node@24/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Start disposable PostgreSQL
        run: |
          name="pg-slimlytics-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "PG_CONTAINER=$name" >> "$GITHUB_ENV"
          docker run -d --name "$name" -p 127.0.0.1::5432 \
            -e POSTGRES_USER=slimlytics -e POSTGRES_PASSWORD=slimlytics -e POSTGRES_DB=slimlytics_test \
            postgres:17-alpine
          for i in $(seq 1 40); do
            docker exec "$name" pg_isready -U slimlytics -d slimlytics_test && break
            sleep 1
          done
          port=$(docker port "$name" 5432/tcp | head -n1 | sed 's/.*://')
          url="postgres://slimlytics:slimlytics@127.0.0.1:$port/slimlytics_test"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=$url" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
      - name: Test, including PostgreSQL integration tests
        run: cargo test --manifest-path backend/Cargo.toml --all-targets -- --include-ignored --test-threads=1
      - name: Stop PostgreSQL
        if: always()
        run: if [ -n "${PG_CONTAINER:-}" ]; then docker rm -f "$PG_CONTAINER"; fi

  web:
    needs: release
    # Every gate runs, so a passing PR vouches for the whole tree; main skips them only when
    # its tree is already tested.
    if: needs.release.outputs.prebuilt != 'true'
    runs-on: [self-hosted, macOS, ARM64, slimlytics]
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain PATH
        run: |
          echo /opt/homebrew/opt/rustup/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/opt/node@24/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Install tracker
        run: npm --prefix tracker ci
      - name: Test and build tracker
        run: npm --prefix tracker test -- --run && npm --prefix tracker run check && npm --prefix tracker run build
      - name: Install frontend
        run: npm --prefix frontend ci
      - name: Copy tracker artifacts
        run: |
          cp tracker/dist/slimlytics.js frontend/static/tracker.js
          cp tracker/dist/slimlytics.js frontend/static/s.js
          mkdir -p frontend/src/lib/server/generated
          cp tracker/dist/slimlytics.js frontend/src/lib/server/generated/tracker.iife.txt
      - name: Check, test, and build frontend
        run: npm --prefix frontend run check && npm --prefix frontend test -- --run && npm --prefix frontend run build

  cli:
    needs: release
    # Every gate runs, so a passing PR vouches for the whole tree; main skips them only when
    # its tree is already tested.
    if: needs.release.outputs.prebuilt != 'true'
    runs-on: [self-hosted, macOS, ARM64, slimlytics]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../.cargo-target/cli
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain PATH
        run: |
          echo /opt/homebrew/opt/rustup/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/opt/node@24/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --manifest-path cli/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml --all-targets
      - name: Locked release build and installer syntax
        run: cargo build --manifest-path cli/Cargo.toml --release --locked && sh -n scripts/install-cli.sh
      # The fastest gate also carries the repository tooling tests.
      - name: Local AI reviewer contract tests
        run: python3 .github/scripts/local_pr_review_test.py -v

  artifacts:
    # The production release: x86-64 backend binary and frontend build, packaged into images
    # on the server at deploy time instead of compiled there.
    needs: release
    if: needs.release.outputs.prebuilt != 'true'
    runs-on: [self-hosted, macOS, ARM64, slimlytics]
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain PATH
        run: |
          echo /opt/homebrew/opt/node@24/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Build release artifacts
        env:
          TREE: ${{ needs.release.outputs.tree }}
        run: |
          store="$HOME/$RELEASE_STORE"
          mkdir -p "$store"
          # Releases are immutable: a complete one for this tree is reused, never replaced.
          if [[ -d "$store/$TREE" ]]; then
            echo "Reusing the release already built for tree ${TREE:0:12}."
            touch "$store/$TREE"
            exit 0
          fi
          staging="$store/.staging-${{ github.run_id }}-${{ github.run_attempt }}"
          ./scripts/build-prebuilt.sh "$staging"
          # Atomic publish: rename(2) fails if a concurrent run already published this tree,
          # in which case that release is kept and this copy is discarded.
          python3 -c 'import os, sys; os.rename(sys.argv[1], sys.argv[2])' "$staging" "$store/$TREE" \
            || echo "Tree ${TREE:0:12} was published concurrently; keeping that release."
          rm -rf "$staging"
          # Prune releases outside the 20 most recently used that are also over a day old, so a
          # release a run has just selected (its mtime is refreshed) is never removed.
          cd "$store"
          ls -1t | grep -E '^[0-9a-f]{40}$' | tail -n +21 | while read -r old; do
            if [[ -n "$(find "./$old" -maxdepth 0 -mtime +1)" ]]; then rm -rf "./$old"; fi
          done

  smoke:
    # Run the exact production images (amd64, emulated) as a composed stack before the release
    # can be marked deployable or shipped.
    needs: [release, artifacts]
    runs-on: [self-hosted, macOS, ARM64, slimlytics]
    env:
      COMPOSE_PROJECT_NAME: slimlytics-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: compose.yaml:compose.ci.yaml:compose.prebuilt.yaml
      # Any free loopback port, so concurrent runs do not collide.
      HTTP_PORT: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain PATH
        run: |
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Copy release into the workspace
        env:
          TREE: ${{ needs.release.outputs.tree }}
        run: cp -R "$HOME/$RELEASE_STORE/$TREE" .prebuilt
      - name: Generate disposable Compose environment
        run: ./scripts/generate-env.sh
      - name: Build images and smoke-test the stack
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 180
          port="$(docker compose port caddy 80 | sed 's/.*://')"
          curl --fail --silent "http://127.0.0.1:$port/health"
          curl --fail --silent "http://127.0.0.1:$port/ready"
          curl --fail --silent --output /dev/null "http://127.0.0.1:$port/"
      - name: Show logs on failure
        if: failure()
        run: docker compose ps; docker compose logs --tail 100
      - name: Stop Compose
        if: always()
        run: docker compose down -v

  mark-tested:
    # Every gate and the smoke test passed: main may deploy this release as-is if it ends up
    # with the same tree.
    needs: [release, backend, web, cli, artifacts, smoke]
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, macOS, ARM64, slimlytics]
    steps:
      - name: Mark release tested
        env:
          TREE: ${{ needs.release.outputs.tree }}
        run: touch "$HOME/$RELEASE_STORE/$TREE/TESTED"

  deploy:
    # Deploy main with either the tested PR release for this tree (gates skipped) or the release
    # this run built, tested, and smoke-tested.
    needs: [release, backend, web, cli, artifacts, smoke]
    if: >-
      ${{ !failure() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          (needs.release.outputs.prebuilt == 'true' || needs.smoke.result == 'success') }}
    runs-on: [self-hosted, macOS, ARM64, slimlytics]
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain PATH
        run: |
          echo /opt/homebrew/opt/node@24/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"

      - name: Skip if main has moved past the tested commit
        id: current
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now $(git rev-parse --short HEAD); skipping $TESTED_SHA in favor of the newer run."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install SSH deploy key
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SLIMLYTICS_DEPLOY_SSH_KEY }}
        run: |
          [[ -n "$DEPLOY_SSH_KEY" ]] || { echo 'SLIMLYTICS_DEPLOY_SSH_KEY secret is not set.' >&2; exit 1; }
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          mkdir -m 700 -p "$ssh_dir/bin"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          # Pinned production host key (verified against cheap.redseam.com).
          echo 'cheap.redseam.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDxaqcHT6cPkz93XZf1cbqPuKCkTrJT3/RoJ629PVIOy' > "$ssh_dir/known_hosts"
          # Wrapper so the deploy script's ssh and rsync use only this key and host key,
          # without touching the persistent runner's ~/.ssh.
          cat > "$ssh_dir/bin/ssh" <<EOF
          #!/bin/sh
          exec /usr/bin/ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes "\$@"
          EOF
          chmod 700 "$ssh_dir/bin/ssh"
          echo "$ssh_dir/bin" >> "$GITHUB_PATH"

      - name: Deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          TREE: ${{ needs.release.outputs.tree }}
        run: |
          # Deploy a private copy, so retention cleanup cannot remove it mid-deploy.
          release="$RUNNER_TEMP/release"
          rm -rf "$release"
          cp -R "$HOME/$RELEASE_STORE/$TREE" "$release"
          ./scripts/deploy-production.sh --skip-checks --prebuilt "$release"

      - name: Remove SSH deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"
